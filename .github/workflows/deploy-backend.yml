name: Build & Push Backend to Docker Hub

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: # Manual trigger

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/wayfinder-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/wayfinder-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/wayfinder-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/wayfinder-backend:buildcache,mode=max

      - name: Image built successfully
        run: |
          echo "✅ Docker image built and pushed to Docker Hub successfully!"
          echo "📦 Image: ${{ secrets.DOCKERHUB_USERNAME }}/wayfinder-backend:latest"
          echo "🔖 SHA tag: ${{ secrets.DOCKERHUB_USERNAME }}/wayfinder-backend:${{ github.sha }}"

  # ==========================================
  # 🚧 VPS DEPLOYMENT
  # ==========================================
  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Ensure app directory exists and navigate to it
            mkdir -p /opt/wayfinder
            cd /opt/wayfinder

            # Create/update .env file
            cat > .env << 'EOF'
            ${{ secrets.ENV_FILE }}
            EOF

            # Pull latest image from Docker Hub using sudo
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/wayfinder-backend:latest

            # Stop and remove old container using sudo
            sudo docker stop wayfinder-backend || true
            sudo docker rm wayfinder-backend || true

            # Run new container using sudo
            sudo docker run -d \
              --name wayfinder-backend \
              --restart unless-stopped \
              -p 5000:5000 \
              --env-file .env \
              ${{ secrets.DOCKERHUB_USERNAME }}/wayfinder-backend:latest

            # Clean up old images using sudo
            sudo docker image prune -af --filter "until=72h"

            # Show running containers using sudo
            echo "✅ Deployment complete!"
            sudo docker ps | grep wayfinder-backend
